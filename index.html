<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Том и Джерри · 3D-площадка</title>
  <link rel="stylesheet" href="style.css?v=3">
  <script src="game.js?v=3" defer></script>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="tag">ПЕСОЧНИЦА / 01</p>
        <h1>Том и Джерри<span>.</span></h1>
      </div>
    </header>
    <section class="stage" aria-label="Игровая площадка">
      <canvas aria-label="Трёхмерная карта с Томом, Джерри, батутом и фигурами"></canvas>
      <div class="stage-top">
        <div class="stage-actions" role="group" aria-label="Настройки игры">
          <button id="reset" type="button">↺ Сначала</button>
          <button id="camera" type="button" aria-pressed="false" aria-label="Вид от первого лица">Вид: сверху</button>
          <button id="fullscreen" type="button" aria-pressed="false" aria-label="На весь экран" title="На весь экран">⛶</button>
        </div>
        <p class="hint">Наступи на батут, чтобы взлететь. <span class="keyboard">C — сменить вид. От первого лица смотри мышью.</span><span class="touch-hint">Тяни джойстик слева. От первого лица веди пальцем по полю для обзора.</span></p>
      </div>
      <p id="respawn-notice" class="respawn-notice" role="status"></p>
      <div class="touch" role="group" aria-label="Сенсорное управление">
        <div class="stick" aria-hidden="true"><span class="stick-knob"></span></div>
        <button id="jump" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20V4M5 11l7-7 7 7"/>
          </svg>
          Прыжок
        </button>
      </div>
    </section>
    <footer><span class="keyboard"><kbd>WASD</kbd> / <kbd>↑ ← ↓ →</kbd> Ходьба · <kbd>Пробел</kbd> Прыжок</span><span>Подойди к фигурам, чтобы их толкнуть</span></footer>
  </main>
</body>
</html>
