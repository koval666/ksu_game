<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Том и Джерри · 3D-площадка</title>
  <link rel="stylesheet" href="style.css?v=2">
  <script src="game.js?v=2" defer></script>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="tag">ПЕСОЧНИЦА / 01</p>
        <h1>Том и Джерри<span>.</span></h1>
      </div>
    </header>
    <section class="stage" aria-label="Игровая площадка">
      <canvas aria-label="Трёхмерная карта с Томом, Джерри, батутом и фигурами"></canvas>
      <div class="stage-top">
        <div class="stage-actions" role="group" aria-label="Настройки игры">
          <button id="reset" type="button">↺ Сначала</button>
          <button id="camera" type="button" aria-pressed="false" aria-label="Вид от первого лица">Вид: сверху</button>
          <button id="fullscreen" type="button" aria-pressed="false" aria-label="На весь экран" title="На весь экран">⛶</button>
        </div>
        <p class="hint">Наступи на батут, чтобы взлететь. <span class="keyboard">C — сменить вид. От первого лица смотри мышью.</span><span class="touch-hint">От первого лица веди пальцем по полю.</span></p>
      </div>
      <p id="respawn-notice" class="respawn-notice" role="status"></p>
      <div class="touch">
        <div class="arrows">
          <button type="button" data-key="KeyW" aria-label="Вперёд">↑</button>
          <button type="button" data-key="KeyA" aria-label="Влево">←</button>
          <button type="button" data-key="KeyS" aria-label="Назад">↓</button>
          <button type="button" data-key="KeyD" aria-label="Вправо">→</button>
        </div>
        <button type="button" data-key="Space">Прыжок</button>
      </div>
    </section>
    <footer><span class="keyboard"><kbd>WASD</kbd> / <kbd>↑ ← ↓ →</kbd> Ходьба · <kbd>Пробел</kbd> Прыжок</span><span>Подойди к фигурам, чтобы их толкнуть</span></footer>
  </main>
</body>
</html>
